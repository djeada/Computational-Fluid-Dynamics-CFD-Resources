name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    name: Links and README index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_links.py
      - run: python tools/generate_index.py --check
      - run: python tools/sync_related_scripts.py --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check scripts tools tests
      - run: ruff format --check scripts tools tests

  scripts:
    name: Run scripts headless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/run_scripts.py --jobs 4 --timeout 180
      - name: Render short reels of every simulation
        run: python tools/make_reels.py --seconds 2 --steps 2 --jobs 4 --timeout 300 --output "$RUNNER_TEMP/reels"
